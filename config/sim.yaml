# Parametri cvora sphero_sim. Namespace (robot ID) zadaje se u launchu.
/**:
  ros__parameters:
    model: pendulum          # models/<model>/
    variant: drive           # drive: vrti se njihalo | bench: njihalo na stolu, vrti se osovina | "": momenti (launch: variant:=...)
    world: arena             # models/worlds/<world>.xml (samo sphere); arena | empty
    model_file: ""           # puni put do XML-a ima prednost pred model/variant
    publish_rate: 100.0      # Hz, petlja objava (telemetrija i kamera imaju svoje frekvencije ispod)
    realtime_factor: 1.0     # 0 = najbrze moguce (sim_bridge koristi zidni sat -> ostaviti 1.0)
    viewer: true             # MuJoCo prozor (treba DISPLAY)
    publish_clock: false     # true -> /clock iz simulacije (onda svi cvorovi use_sim_time:=true)

    # aktuatori: vx, vy u [-1, 1] (RC impuls 1500 +/- 500 us) -> brzina zgloba
    esc_gain: 28.0           # rad/s po jedinici vx iznad mrtve zone - PROCJENA (gas 0.09 -> ~0.26 m/s)
    esc_deadband: 0.04       # 20 us - PROCJENA (robot_bridge kompenzira s U0_SPEED = 0.05)
    esc_tau: 1.0             # s, kasnjenje ESC-a + motora (prvi red) - PROCJENA; robot ubrzava jos sporije (~5 s do 0.2 m/s)
    servo_gain_deg: 58.0     # deg/s po jedinici vy - iz baga MSU_test_cet_006
    servo_deadband: 0.01     # 5 us
    servo_sign: -1.0         # smjer servoa: vy < 0 -> roll_rel raste (vy = -RollPID je negativna povratna veza),
                             # a roll_rel > 0 -> skretanje ulijevo (yaw raste), kao na robotu

    # telemetrija i kamera kao na robotu
    telemetry_rate: 50.0     # Hz, sim/telemetry
    roll_sign: 1.0           # roll_rel = roll_sign * kut servo zgloba
    yaw_sign: 1.0            # kao na robotu: 0 = +x, +90 = +y, 180 = -x, -90 = -y (suprotno od kazaljke)
    yaw_offset_deg: 0.0      # IMU yaw = svijet + offset; postaviti na yaw_offset robota iz robot_config.json
                             # (bag MSU_test_cet_006: ~72 deg)
    init_x: 0.0              # pocetna poza kugle u svijetu [m]
    init_y: 0.0
    init_yaw_deg: 0.0        # pocetni smjer voznje u svijetu [deg], 0 = +x
    camera_topic: /b0/pose
    camera_rate: 33.0        # Hz
    camera_noise: 0.0        # sigma suma pozicije [m]; npr. 0.005
    camera_frame: world